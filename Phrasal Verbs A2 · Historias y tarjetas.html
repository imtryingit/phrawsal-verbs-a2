<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phrasal Verbs A2 · Historias y tarjetas</title>
<style>
:root{--bg:#f6f0e8;--panel:#fffaf3;--line:#e0d3c3;--text:#2a211a;--mute:#6e5f51;--acc:#9a5b0a;--ok:#2f7d52;--bad:#b2432f;--okbg:#e4f2ea;--badbg:#f8e3de;--btn:#fffaf3;--hdr:rgba(246,240,232,.94);--shade:#4a3a2a55;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141110;--panel:#1e1916;--line:#352c26;--text:#f1e8de;--mute:#a99a8b;--acc:#e8a948;--ok:#7fc29b;--bad:#e5806f;--okbg:#1f2d25;--badbg:#33201c;--btn:#1a1209;--hdr:rgba(20,17,16,.94);--shade:#000a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141110;--panel:#1e1916;--line:#352c26;--text:#f1e8de;--mute:#a99a8b;--acc:#e8a948;--ok:#7fc29b;--bad:#e5806f;--okbg:#1f2d25;--badbg:#33201c;--btn:#1a1209;--hdr:rgba(20,17,16,.94);--shade:#000a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:18px/1.7 Georgia,serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 10px}
.tabs,.pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pills{margin-top:8px}
.tab,.pill{background:none;border:1px solid transparent;border-radius:10px;padding:7px 14px;font:600 15px system-ui,sans-serif;color:var(--mute)}
.pill{border-color:var(--line);font-size:13px;padding:5px 10px}
.tab[aria-selected=true],.pill[aria-pressed=true]{background:var(--panel);border-color:var(--acc);color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:clamp(25px,5vw,34px);line-height:1.2;margin-bottom:4px}
.sub,.ctx,.hint{color:var(--mute);font:15px/1.5 system-ui,sans-serif}.sub{margin-bottom:20px}
section{display:none}section.on{display:block}
.story{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:18px 22px;font-size:20px;line-height:1.9}
.pv{color:var(--acc);font-weight:700;border:0;border-bottom:1.5px dashed var(--acc);background:none;padding:0}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:2px solid var(--acc);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));font:16px/1.5 system-ui,sans-serif;display:none;box-shadow:0 -10px 30px var(--shade)}
#sheet.on{display:block;animation:up .25s}#sheet>div{max-width:720px;margin:auto}
#sheet h3{font:700 24px Georgia,serif;color:var(--acc)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.btn{background:var(--acc);color:var(--btn);border:0;border-radius:10px;padding:10px 20px;font:700 16px system-ui,sans-serif}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.sp{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:16px}
.bar{display:flex;justify-content:space-between;font:600 15px system-ui,sans-serif;color:var(--mute);margin-bottom:8px}
.prog,.tbar{height:5px;background:var(--line);border-radius:5px;margin-bottom:18px;overflow:hidden}
.prog i,.tbar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.tbar i{width:100%;transition:width 9s linear}
.fc{perspective:900px;cursor:pointer;margin-bottom:16px;animation:pop .35s;outline-offset:4px}
@keyframes pop{from{transform:scale(.92) translateX(30px);opacity:0}}
.in{display:grid;transform-style:preserve-3d;transition:transform .45s}
.fc.f .in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;background:var(--panel);border:2px solid var(--acc);border-radius:18px;min-height:270px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.face.back{transform:rotateY(180deg)}
.fv{font-size:clamp(36px,9vw,56px);font-weight:700;color:var(--acc);line-height:1.1}
.fv2{font-size:clamp(26px,6vw,34px);font-weight:700}
.ex{font:20px/1.5 Georgia,serif}.ex b{color:var(--acc)}.exs{color:var(--mute);font:16px system-ui,sans-serif}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 4px;font:600 14px/1.3 system-ui,sans-serif}
.grades small{display:block;color:var(--mute);font-weight:400}
.grades button:hover{border-color:var(--acc)}
.q{font-size:clamp(21px,4vw,27px);line-height:1.5;margin-bottom:6px}
.gap{display:inline-block;min-width:90px;border-bottom:2px solid var(--acc);text-align:center;color:var(--acc)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font:18px system-ui,sans-serif}
.opt.ok{border-color:var(--ok);background:var(--okbg);animation:pop2 .3s}
.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.fb{margin-top:16px;padding:14px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--acc);font:16px/1.6 system-ui,sans-serif;display:grid;gap:6px;animation:up .25s}.fb .ex{font-size:18px}.fb .btn{justify-self:start;margin-top:6px}
@keyframes pop2{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.end{text-align:center;padding:30px 0;display:grid;gap:12px;justify-items:center}.big{font-size:64px;line-height:1}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cf{position:fixed;top:-30px;font-size:26px;animation:fall 1.8s ease-in forwards;pointer-events:none;z-index:99}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="tabs" role="tablist">
    <button class="tab" data-t="read" aria-selected="true">📖 Historia</button>
    <button class="tab" data-t="cards" aria-selected="false">🃏 Tarjetas</button>
    <button class="tab" data-t="quiz" aria-selected="false">⚡ Ronda rápida</button>
  </div>
  <div class="pills" id="pills"></div>
</header>
<main>
  <section id="read" class="on"></section>
  <section id="cards"></section>
  <section id="quiz"></section>
</main>
<div id="sheet"><div id="sc"></div></div>
<script>
// [verbo, significado, ejemplo (A2), traducción]
const D=[
{n:"Mi mañana",e:"☀️",s:"I {wake up} at six. It is dark, so I {turn on} the light and {get up}. I {put on} my jeans and a warm jacket. I {look for} my keys, but I cannot find them! Then I {pick up} my bag and leave. In the evening my friends {go out}, and they ask me to join. I say: “OK, but I {come back} before ten!” At home, I {take off} my shoes and {turn off} the TV.",
w:[["wake up","despertarse","I wake up at six every day.","Me despierto a las seis todos los días."],["get up","levantarse (de la cama)","Get up! The bus is here.","¡Levántate! Llegó el bus."],["put on","ponerse (ropa)","Put on your jacket. It is cold.","Ponte la chaqueta. Hace frío."],["take off","quitarse (ropa)","Please take off your shoes.","Por favor, quítate los zapatos."],["turn on","encender","Can you turn on the light?","¿Puedes encender la luz?"],["turn off","apagar","I turn off my phone at night.","Apago el celular en la noche."],["look for","buscar","I look for my keys every morning.","Busco mis llaves cada mañana."],["pick up","recoger, levantar","I pick up my sister after school.","Recojo a mi hermana después del colegio."],["come back","volver","Come back before dinner.","Vuelve antes de la cena."],["go out","salir (a divertirse)","We go out on Friday nights.","Salimos los viernes en la noche."]]},
{n:"Un sábado de compras",e:"🛍️",s:"On Saturday I {look after} my little brother. We {get on} the bus and {get off} near the mall. “{Hurry up}!” I say, because the shops close soon. He wants to {try on} a red hat. I {find out} the price: it is too expensive! We {give back} the hat. Then we {sit down} in a café. My brother {stand up|stands up} to get a drink, and I {throw away} our old paper bags.",
w:[["sit down","sentarse","Please sit down here.","Por favor, siéntate aquí."],["stand up","ponerse de pie","Stand up and say your name.","Ponte de pie y di tu nombre."],["give back","devolver","Give back my book, please.","Devuélveme mi libro, por favor."],["throw away","botar, tirar","Throw away the old bottles.","Bota las botellas viejas."],["try on","probarse (ropa)","Can I try on this shirt?","¿Me puedo probar esta camisa?"],["find out","averiguar, descubrir","I want to find out the price.","Quiero averiguar el precio."],["look after","cuidar","I look after my little brother.","Cuido a mi hermanito."],["get on","subirse (bus, tren)","We get on the bus at seven.","Nos subimos al bus a las siete."],["get off","bajarse (bus, tren)","Get off at the next stop.","Bájate en la próxima parada."],["hurry up","apurarse","Hurry up! We are late.","¡Apúrate! Vamos tarde."]]},
{n:"Viaje a Cartagena",e:"✈️",s:"I {sign up} for a trip to Cartagena and I {look forward to} it a lot. First, I {look up} hotels on the internet. At the hotel we {check in} and {fill out} a short form. Our friend does not {show up} on time, but we {carry on} without him. In the afternoon our taxi {break down|breaks down}, and we {run out of} water. I want to {give up}, but my sister says: “Keep going!”",
w:[["sign up","inscribirse","I want to sign up for English classes.","Quiero inscribirme en clases de inglés."],["check in","registrarse (hotel, vuelo)","We check in at the hotel at two.","Nos registramos en el hotel a las dos."],["show up","aparecer, llegar","Please show up on time.","Por favor, llega a tiempo."],["run out of","quedarse sin","We run out of milk every week.","Nos quedamos sin leche cada semana."],["give up","rendirse","Don’t give up. You can do it!","¡No te rindas! ¡Tú puedes!"],["carry on","seguir, continuar","Carry on. You are doing well.","Sigue. Lo estás haciendo bien."],["break down","dañarse (un carro)","Cars break down in the rain.","Los carros se dañan con la lluvia."],["look forward to","esperar con ganas","I look forward to the weekend.","Espero el fin de semana con ganas."],["look up","buscar (diccionario, internet)","Look up the word in the dictionary.","Busca la palabra en el diccionario."],["fill out","llenar (un formulario)","Please fill out this form.","Por favor, llena este formulario."]]},
{n:"Día de clase",e:"🏫",s:"The teacher says: “{Come in}, please.” I {write down} the new words. She asks a girl to {read out} the answer. The girl is shy, so the teacher says: “{Speak up}, please!” Then we {look at} the board. I cannot {figure out} a hard problem and I want to cry, but my friend says: “{Calm down}!” The teacher says: “{Slow down}, then {go on}.” At the end, we {hand in} our homework.",
w:[["come in","entrar","Come in and sit down.","Entra y siéntate."],["write down","anotar","Write down the new words.","Anota las palabras nuevas."],["read out","leer en voz alta","Read out the answer, please.","Lee la respuesta en voz alta, por favor."],["speak up","hablar más fuerte","Please speak up. I can’t hear you.","Por favor, habla más fuerte. No te oigo."],["look at","mirar","Look at the board, please.","Mira el tablero, por favor."],["figure out","resolver, descifrar","I can’t figure out this problem.","No puedo resolver este problema."],["calm down","calmarse","Calm down. It’s only a test.","Cálmate. Es solo un examen."],["slow down","ir más despacio","Slow down, please.","Más despacio, por favor."],["go on","continuar, seguir","Go on, I’m listening.","Sigue, te escucho."],["hand in","entregar (tarea)","Hand in your homework today.","Entrega la tarea hoy."]]},
{n:"Cocina y comida",e:"🍽️",s:"On Sundays we {eat out}, but today I cook at home. I {cut up} the carrots and {heat up} the soup. It is very hot, so we wait for it to {cool down}. My brother {fill up|fills up} the glasses with water. A neighbour is loud, so I ask him to {turn down} his music. I buy the bread, and my brother promises to {pay back} the money on Friday. After lunch, I {clean up} the kitchen, {wash up} and {take away} the plates.",
w:[["eat out","comer fuera","We eat out on Sundays.","Comemos fuera los domingos."],["cut up","cortar en trozos","Cut up the carrots, please.","Corta las zanahorias, por favor."],["heat up","calentar (comida)","Heat up the soup for me.","Caliéntame la sopa."],["cool down","enfriarse","Wait. The soup needs to cool down.","Espera. La sopa debe enfriarse."],["fill up","llenar","Fill up the glass with water.","Llena el vaso con agua."],["turn down","bajar (volumen)","Turn down the music, please.","Baja la música, por favor."],["pay back","devolver (dinero)","I will pay back the money on Friday.","Te devuelvo el dinero el viernes."],["clean up","limpiar, ordenar","Clean up the kitchen after dinner.","Limpia la cocina después de la cena."],["wash up","lavar los platos","I wash up after lunch.","Lavo los platos después del almuerzo."],["take away","retirar, llevarse","Please take away the plates.","Por favor, retira los platos."]]},
{n:"Mi casa nueva",e:"🏠",s:"Today we {move in} to a new flat. My cousin {move out|moves out} of the old one next week. First we {tidy up} the rooms and {put away} the clothes. Dad helps me {hang up} my coat and {put up} a big picture. I {plug in} the TV, and my sister says: “{Take out} the boxes, please!” Our dog is outside, so we {let in} the dog. On Sunday we {sleep in}. What a happy home!",
w:[["move in","mudarse (llegar)","We move in on Monday.","Nos mudamos el lunes."],["move out","mudarse (irse)","My cousin will move out next month.","Mi primo se mudará el próximo mes."],["tidy up","ordenar","Tidy up your room, please.","Ordena tu cuarto, por favor."],["put away","guardar","Put away your toys, please.","Guarda tus juguetes, por favor."],["hang up","colgar","Hang up your coat here.","Cuelga tu abrigo aquí."],["put up","colgar, poner (un cuadro)","Let’s put up the picture on the wall.","Pongamos el cuadro en la pared."],["plug in","enchufar","Plug in your phone here.","Enchufa tu celular aquí."],["take out","sacar","Take out the trash, please.","Saca la basura, por favor."],["let in","dejar entrar","Please let in the dog.","Por favor, deja entrar al perro."],["sleep in","dormir hasta tarde","I sleep in on Sundays.","Duermo hasta tarde los domingos."]]},
{n:"Amigos y llamadas",e:"📱",s:"My friend Laura calls me, but I am busy. I say: “{Hold on}, please.” Later I {call back}. She is sad, so I say: “{Cheer up}!” We want to {catch up}, so we {get together} on Saturday. “{Come over} to my house,” she says. Her brother can {drop by} too. Then I {pass on} the news to our other friends. We promise to {keep in touch}, and I {write back} to her messages every day.",
w:[["hold on","esperar un momento","Hold on, please. I’m busy.","Espera un momento, por favor. Estoy ocupado."],["call back","devolver la llamada","I will call back later.","Te devuelvo la llamada más tarde."],["cheer up","animarse","Cheer up! Tomorrow is a new day.","¡Anímate! Mañana es un nuevo día."],["catch up","ponerse al día","Let’s catch up this weekend.","Pongámonos al día este fin de semana."],["get together","reunirse","Let’s get together on Saturday.","Reunámonos el sábado."],["come over","venir a casa","Come over to my house tonight.","Ven a mi casa esta noche."],["drop by","pasar a visitar","Drop by after work.","Pasa a visitarme después del trabajo."],["pass on","transmitir","Please pass on the message.","Por favor, transmite el mensaje."],["keep in touch","mantenerse en contacto","Let’s keep in touch.","Mantengámonos en contacto."],["write back","responder (por escrito)","I write back to you tonight.","Te respondo esta noche."]]},
{n:"Paseo por la ciudad",e:"🚕",s:"We {set off} early to visit the old city. Dad {drop off|drops off} my bag at the hotel. We {line up} for tickets and {get in} a taxi. It is easy to {get around} here! The driver says: “Sorry, I must {turn around}.” Then we {get out} and {look around}. The street is wet, so be careful: you can {fall down}. At night, we {hang out} in the park.",
w:[["set off","salir de viaje","We set off at five in the morning.","Salimos de viaje a las cinco de la mañana."],["drop off","dejar (a alguien o algo)","I drop off my kids at school.","Dejo a mis hijos en el colegio."],["line up","hacer fila","Line up at the door, please.","Hagan fila en la puerta, por favor."],["get in","subirse (carro, taxi)","Get in the taxi, please.","Súbete al taxi, por favor."],["get around","moverse por un lugar","It is easy to get around by bus.","Es fácil moverse en bus."],["turn around","dar la vuelta","Turn around at the corner.","Da la vuelta en la esquina."],["get out","bajarse (carro, taxi)","Get out here, please.","Bájate aquí, por favor."],["look around","mirar alrededor","Let’s look around the old city.","Miremos alrededor de la ciudad vieja."],["fall down","caerse","Be careful, you can fall down.","Cuidado, te puedes caer."],["hang out","pasar el rato","We hang out in the park.","Pasamos el rato en el parque."]]},
{n:"Vida sana",e:"💪",s:"I want to {take up} tennis, so I {work out} three times a week. First I {warm up}: I run slowly and {breathe in} and {breathe out}. I {cut down on} sugar and I do not {stay up} late. Today I have a cold. The doctor says: “{Lie down}, rest, and you will {get better}.” I want to {keep up} my routine, but health is first.",
w:[["take up","empezar (un hobby)","I want to take up tennis.","Quiero empezar a jugar tenis."],["work out","hacer ejercicio","I work out three times a week.","Hago ejercicio tres veces por semana."],["warm up","calentar (el cuerpo)","Warm up before you run.","Calienta antes de correr."],["breathe in","inspirar","Breathe in slowly.","Inspira despacio."],["breathe out","espirar","Now breathe out.","Ahora espira."],["cut down on","reducir (consumo)","I cut down on sugar.","Reduzco el azúcar."],["stay up","quedarse despierto","Don’t stay up late.","No te quedes despierto hasta tarde."],["lie down","acostarse","Lie down and rest.","Acuéstate y descansa."],["get better","mejorarse","I hope you get better soon.","Espero que te mejores pronto."],["keep up","mantener el ritmo","Keep up the good work!","¡Sigue con el buen trabajo!"]]},
{n:"Computador y ahorros",e:"💻",s:"I {set up} my new laptop. I {log in} with my email and {click on} an app. I {scroll down} to read the news and {print out} a ticket. I {back up} my photos. I want to {save up} for a new phone, so I {give away} my old books. At night I {log out} and {shut down} the computer.",
w:[["set up","configurar, preparar","Can you set up my new phone?","¿Puedes configurar mi celular nuevo?"],["log in","iniciar sesión","Log in with your email.","Inicia sesión con tu correo."],["click on","hacer clic en","Click on the blue button.","Haz clic en el botón azul."],["scroll down","bajar en la pantalla","Scroll down to see more.","Baja en la pantalla para ver más."],["print out","imprimir","Print out this page, please.","Imprime esta página, por favor."],["back up","hacer copia de seguridad","Back up your photos today.","Haz una copia de tus fotos hoy."],["save up","ahorrar","I save up for a new phone.","Ahorro para un celular nuevo."],["give away","regalar","I give away my old clothes.","Regalo mi ropa vieja."],["log out","cerrar sesión","Don’t forget to log out.","No olvides cerrar sesión."],["shut down","apagar (computador)","Shut down the computer at night.","Apaga el computador en la noche."]]}
];
const $=s=>document.querySelector(s),all=D.flatMap(d=>d.w);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const hl=(t,k)=>t.replace(new RegExp(k,"i"),m=>`<b>${m}</b>`);
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
let best={};try{best=JSON.parse(localStorage.getItem("pvb")||"{}")}catch(e){}
let cur=0,tab="read",Q=[],R=[],qi=0,sc=0,cb=0,tm=0,t0=0;
function burst(){for(let i=0;i<26;i++){const s=document.createElement("span");s.className="cf";s.textContent=["🎉","⭐","✨","🔥"][i%4];s.style.cssText=`left:${Math.random()*95}vw;animation-delay:${Math.random()*.4}s`;document.body.append(s);setTimeout(()=>s.remove(),2300)}}
function pills(){$("#pills").innerHTML=D.map((d,i)=>`<button class="pill" aria-pressed="${i==cur}" data-i="${i}" title="${d.n}">${d.e} ${i+1}${best[i]?" ⭐":""}</button>`).join("")}
function story(){const d=D[cur];$("#read").innerHTML=`<h1>${d.e} ${d.n}</h1><p class="sub">Historia ${cur+1} de ${D.length}. Lee la historia y toca cada verbo en color: verás su significado y un ejemplo. Después pasa a las tarjetas.</p><article class="story">${d.s.replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,k,s)=>`<button class="pv" data-k="${k}">${s||k}</button>`)}</article><div class="row" style="margin-top:20px"><button class="btn" data-go="cards">🃏 Practicar estos 10 verbos</button></div>`}
function sheet(k){const w=all.find(x=>x[0]===k);$("#sc").innerHTML=`<h3>${w[0]} <button class="sp" data-say="${w[0]}">🔊</button></h3><p><b>${w[1]}</b></p><p class="ex">${hl(w[2],w[0])}</p><p class="exs">${w[3]}</p>`;$("#sheet").classList.add("on");say(w[0])}
function cards(start){
  if(start)Q=[...D[cur].w];
  const el=$("#cards");
  if(!Q.length){el.innerHTML=`<div class="end"><div class="big">🎉</div><h1>¡Mazo ${cur+1} completo!</h1><p class="sub">Ahora demuestra que los recuerdas, rápido.</p><div class="row"><button class="btn" data-go="quiz">⚡ Ronda rápida</button><button class="btn ghost" data-go="again">Repetir tarjetas</button></div></div>`;burst();return}
  const w=Q[0],d=10-Q.length;
  el.innerHTML=`<div class="bar"><span>Faltan ${Q.length}</span><span>${d}/10</span></div><div class="prog"><i style="width:${d*10}%"></i></div>
  <div class="fc" id="fc" tabindex="0" role="button" aria-label="Voltear tarjeta"><div class="in"><div class="face"><div class="fv">${w[0]}</div><button class="sp" data-say="${w[0]}">🔊</button><p class="hint">Piensa qué significa · toca o pulsa Espacio</p></div><div class="face back"><div class="fv2">${w[1]}</div><p class="ex">${hl(w[2],w[0])}</p><p class="exs">${w[3]}</p></div></div></div>
  <div class="grades" id="gr" style="visibility:hidden"><button data-g="0">Otra vez<small>1</small></button><button data-g="1">Difícil<small>2</small></button><button data-g="2">Bien<small>3</small></button><button data-g="3">Fácil<small>4</small></button></div>`;
  $("#fc").focus({preventScroll:true});say(w[0]);
}
function flip(){const f=$("#fc");if(!f||f.classList.contains("f"))return;f.classList.add("f");$("#gr").style.visibility="visible";say(Q[0][2])}
function grade(g){if(!$("#fc")?.classList.contains("f"))return;const c=Q.shift();if(g<2)Q.splice(Math.min(g?4:2,Q.length),0,c);cards()}
function quiz(start){
  clearTimeout(tm);
  if(start){R=shuf(D[cur].w);qi=0;sc=0;cb=0}
  const el=$("#quiz");
  if(qi>=R.length){const b=best[cur]||0;best[cur]=Math.max(b,sc);try{localStorage.setItem("pvb",JSON.stringify(best))}catch(e){}pills();
    el.innerHTML=`<div class="end"><div class="big">${sc>1200?"🏆":"⭐"}</div><h1>${sc} puntos</h1><p class="sub">${sc>b?"¡Nuevo récord!":"Tu récord: "+b}</p><div class="row"><button class="btn" data-go="quizagain">Otra ronda</button>${cur<D.length-1?`<button class="btn ghost" data-go="next">Siguiente mazo →</button>`:""}</div></div>`;if(sc>b)burst();return}
  const w=R[qi],o=shuf([w,...shuf(D[cur].w.filter(x=>x[0]!==w[0])).slice(0,3)]);
  el.innerHTML=`<div class="bar"><span>Pregunta ${qi+1}/${R.length}</span><span>🔥 x${cb} · ${sc} pts</span></div><div class="tbar"><i id="tb"></i></div><p class="q">${w[2].replace(new RegExp(w[0],"i"),'<span class="gap">___</span>')}</p><p class="ctx">${w[3]}</p><div class="opts">${o.map(x=>`<button class="opt" data-k="${x[0]}">${x[0]}</button>`).join("")}</div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const t=$("#tb");if(t)t.style.width="0"}));
  t0=Date.now();tm=setTimeout(()=>pick(null),9000);
}
function pick(k){
  clearTimeout(tm);const w=R[qi],ok=k===w[0];
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.k===w[0])b.classList.add("ok");else if(b.dataset.k===k)b.classList.add("bad")});
  document.querySelector(".gap").innerHTML=w[0];
  if(ok){cb++;sc+=100+Math.round(Math.max(0,9000-(Date.now()-t0))/90)+Math.min(cb,5)*10}else{cb=0;if(!w.r){const c=[...w];c.r=1;R.push(c)}}
  const p=k&&all.find(x=>x[0]===k),t=$("#tb");t.style.width=getComputedStyle(t).width;t.style.transition="none";
  const why=ok?`Correcto. <b>${w[0]}</b> significa «${w[1]}», y es justo lo que pide la frase.`:k?`Elegiste <b>${k}</b>, que significa «${p[1]}». Aquí la frase habla de «${w[1]}», así que el verbo correcto es <b>${w[0]}</b>.`:`Se acabó el tiempo. La frase pide «${w[1]}»: <b>${w[0]}</b>.`;
  const f=document.createElement("div");f.className="fb";f.innerHTML=`<p>${ok?"✅":"❌"} ${why}</p><p>📖 <span class="ex">${hl(w[2],w[0])}</span></p><p>🇪🇸 ${w[3]}</p><button class="btn" id="nx" data-go="qnext">${qi+1>=R.length?"Ver resultado":"Siguiente →"}</button>`;
  $("#quiz").append(f);f.scrollIntoView({block:"nearest",behavior:"smooth"});$("#nx").focus();say(w[2]);
}
function go(t){tab=t;document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));document.querySelectorAll("main section").forEach(s=>s.classList.toggle("on",s.id===t));$("#sheet").classList.remove("on");clearTimeout(tm);pills();
  if(t==="read")story();if(t==="cards")cards(true);if(t==="quiz")quiz(true);scrollTo(0,0)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,.fc");
  if(!t){$("#sheet").classList.remove("on");return}
  if(t.dataset.t)go(t.dataset.t);
  else if(t.dataset.i){cur=+t.dataset.i;go(tab)}
  else if(t.dataset.say)say(t.dataset.say);
  else if(t.classList.contains("pv"))sheet(t.dataset.k);
  else if(t.dataset.g)grade(+t.dataset.g);
  else if(t.classList.contains("fc"))flip();
  else if(t.classList.contains("opt"))pick(t.dataset.k);
  else if(t.dataset.go){const g=t.dataset.go;if(g==="cards"||g==="quiz")go(g);else if(g==="again")cards(true);else if(g==="quizagain")quiz(true);else if(g==="next"){cur++;go("cards")}else if(g==="qnext"){qi++;quiz()}}
});
document.addEventListener("keydown",e=>{
  if(tab!=="cards"||!$("#fc"))return;
  if(e.key===" "||e.key==="Enter"){if(e.target.tagName!=="BUTTON"){e.preventDefault();flip()}}
  else if("1234".includes(e.key))grade(+e.key-1);
});
go("read");
</script>
</body>
</html>
